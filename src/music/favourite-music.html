MO=[['燕麦','#ece5da','#b5838d'],['灰粉','#e6d6d3','#a68a7e'],['灰绿','#d7ddd2','#8f9f8a'],['灰蓝','#d3dbe0','#7f93a3'],['灰紫','#dcd5de','#9a8aa5'],['驼色','#e3d8c8','#c1a283']],

const trackColors=t=> (t&&t.c)||['#e8b7b0','#a9c2ae','#f4e9dc'];
// 网易云 p1/p2/p3/p4.music.126.net 的图片会校验 Referer（防盗链）。
// 在 background-image 上没法控制 Referer，所以 dev 环境走本地代理 /__img?u=… ，
// 部署环境加参数 ?v=2 让网易云自己的 CDN 边缘节点放行（很多场景下 OK）。
function fixCoverUrl(u){
  if(!u) return '';
  if(typeof u!=='string') return '';
  if(u.indexOf('music.126.net')===-1) return u;
  // dev 走本地代理（无 Referer 反代），避免 Vite + iframe 双重 Referer 拦截
  if(location.hostname==='localhost' || location.hostname==='127.0.0.1' || location.protocol==='http:'){
    return '/__img?u=' + encodeURIComponent(u);
  }
  return u;
}
const cv=(t,c='')=>{
  if(!t)return `<div class="cv s1 ${c}" style="--a:#ddd;--b:#ccc;--c:#eee"></div>`;
  if(t.cover||t.img)return `<div class="cv im ${c}" style="background-image:url('${esc(fixCoverUrl(t.cover||t.img))}')"></div>`;
  const cols=trackColors(t);
  return `<div class="cv s${t.s??1} ${c}" style="--a:${cols[0]};--b:${cols[1]};--c:${cols[2]}"></div>`;
};
let meAvatar='';
let meMusicId='我';
const av=c=>{
  if(c&&c.avatar)return `<div class="av" style="background-image:url('${esc(fixCoverUrl(c.avatar))}');background-size:cover;background-position:center"></div>`;
  return `<div class="av" style="--h:${c&&c.h!=null?c.h:200}">${esc(((c&&c.n)||'?')[0])}</div>`;
};
const meAv=()=>{
  if(meAvatar)return `<div class="av me" style="background:url('${esc(fixCoverUrl(meAvatar))}') center/cover no-repeat;color:transparent"></div>`;
  return `<div class="av me">我</div>`;
};
const cc=()=>se?characters.find(x=>x.id===se.cid):null;

const peerView=()=>{

};

// 歌单相关函数
let plTab='cloud'; // 'cloud' | 'local'
function openPlaylistPanel(){$('#pl-panel').classList.add('open');renderPlaylists()}
function closePlaylistPanel(){$('#pl-panel').classList.remove('open')}
function renderPlaylists(){
  const tabHtml=`<div style="display:flex;gap:8px;margin-bottom:12px;padding:0 4px"><button data-a="pl-tab-cloud" style="flex:1;padding:8px;border-radius:99px;font-size:12px;font-weight:550;${plTab==='cloud'?'background:var(--ink);color:var(--bg)':'background:var(--card);color:var(--mut)'};border:1px solid ${plTab==='cloud'?'var(--ink)':'var(--line)'}">☁️ 云音乐</button><button data-a="pl-tab-local" style="flex:1;padding:8px;border-radius:99px;font-size:12px;font-weight:550;${plTab==='local'?'background:var(--ink);color:var(--bg)':'background:var(--card);color:var(--mut)'};border:1px solid ${plTab==='local'?'var(--ink)':'var(--line)'}">💾 本地收藏</button></div>`;
  if(plTab==='cloud'){
    if(!cook){$('#pl-body').innerHTML=tabHtml+'<div class="pl-empty">请先登录网易云账号<br>然后点击右上角「☁️ 云音乐」导入歌单</div>';return}
    if(!cloudPlaylists.length){$('#pl-body').innerHTML=tabHtml+'<div class="pl-empty">还没有导入云歌单<br><button data-a="load-cloud" style="margin-top:12px;padding:10px 20px;border-radius:99px;background:var(--ink);color:var(--bg);font-size:13px">点击导入我的歌单</button></div>';return}
    const syncTip=cloudSyncedAt?`已缓存 · ${fmtSync(cloudSyncedAt)} · 点 ☁️ 可刷新`:`已缓存 · 点 ☁️ 可刷新`;
    $('#pl-sub').textContent=syncTip;
    let html=tabHtml+`<div class="lab" style="margin-top:4px">${esc(syncTip)}</div>`;
    for(const pl of cloudPlaylists){html+=`<div class="pl-item" data-pid="${esc(pl.id)}" data-a="pl-play-cloud"><div class="cv im" style="background-image:url('${esc(fixCoverUrl(pl.cover))}')"></div><div class="pl-meta"><b>${esc(pl.name)}</b><small>${pl.trackCount} 首</small></div><button class="pl-add-btn" data-pid="${esc(pl.id)}" data-a="pl-load-cloud">${ic('plus',18)}</button></div>`}
    $('#pl-body').innerHTML=html;
  }else{
    $('#pl-sub').textContent=`本地 · ${liked.length} 首`;
    if(!liked.length){$('#pl-body').innerHTML=tabHtml+'<div class="pl-empty">还没有收藏的歌曲<br>搜索歌曲，点爱心加入收藏</div>';return}
    let html=tabHtml+'<div class="lab" style="margin-top:8px">我喜欢的音乐</div>';
    for(const t of liked){html+=`<div class="row" data-t="${esc(t.id)}">${cv(t,'rc')}<div class="rt"><b>${esc(t.name||t.n)}</b><span>${esc(t.artist||t.a)}</span></div></div>`}
    $('#pl-body').innerHTML=html;
  }
}
function openNewPlaylistSheet(){sheet(`<h3>新建歌单${X}</h3><p style="font-size:12px;color:var(--mut);margin-bottom:12px">给歌单起个名字</p><input type="text" id="pl-name-in" placeholder="例如：工作时的BGM" style="width:100%;padding:13px;border-radius:12px;border:0;background:var(--bg);font-size:14px;outline:0"><button class="sv" data-a="do-create-pl">创建歌单</button>`)}
function doCreatePlaylist(){const v=$('#pl-name-in')?.value?.trim();if(!v){toast('请输入歌单名称');return}const id='pl-'+Date.now();myPlaylists.push({id,name:v,tracks:[]});renderPlaylists();$('#layer').innerHTML='';toast('歌单「'+v+'」已创建')}

function toast(m){const e=document.createElement('div');e.className='toast';e.textContent=m;ph.append(e);setTimeout(()=>e.remove(),2200)}
function apply(){const S=document.documentElement.style,{bg,acc}=th,d=lum(bg)<.45,v=d?{bg,card:'color-mix(in srgb,'+bg+' 88%,#fff)',ink:'#f4eef2',mut:'#a89fa6',line:'rgba(255,255,255,.1)',avl:'30%',avt:'88%'}:{bg,card:lum(bg)>.985?'#f6f5f3':'color-mix(in srgb,'+bg+' 45%,#fff)',ink:'#2d2724',mut:'#857b73',line:'rgba(60,40,30,.1)',avl:'86%',avt:'30%'};
for(const k in v)S.setProperty('--'+k,v[k]);S.setProperty('--rose',acc);S.setProperty('--on',lum(acc)>.62?'#2d2724':'#fff');S.setProperty('--rb','color-mix(in srgb,'+acc+' 24%,'+(d?bg:'#fff')+')');S.colorScheme=d?'dark':'light'}

function subs(){const l=liked,s=l.reduce((a,t)=>a+(Number(t.duration)||0),0);$('#sub').textContent=l.length?'我喜欢的音乐 · '+l.length+' 首 · 约 '+Math.max(1,Math.round(s/60))+' 分钟':'我喜欢的音乐 · 搜索并点爱心加入';$('#hero').innerHTML=`<button class="pl2" data-a="playall">${ic('play',18,1)}播放全部</button><button class="pl-btn" data-a="open-playlists">${ic('folder',18)}${ic('heart',18,1)}<small style="font-size:12px;font-weight:400">${l.length}</small></button>`}
function list(){const q=$('#q').value.trim().toLowerCase();$('#hero').style.display=q?'none':'flex';$('#cl').style.display=q?'grid':'none';
const row=(t,s)=>`<div class="row" data-t="${esc(t.id)}">${cv(t,'rc')}<div class="rt"><b class="${cur&&cur.id==t.id?'hot':''}">${esc(t.name||t.n)}</b><span>${esc(t.artist||t.a)} · ${esc(t.album||t.al||'')}</span></div>${s?`<button class="hb ${t.liked||liked.some(x=>x.id==t.id)?'l':''}" data-h="${esc(t.id)}">${ic('heart',19,t.liked||liked.some(x=>x.id==t.id))}</button>`:cur&&cur.id==t.id?'<div class="wv sm">'+'<i></i>'.repeat(4)+'</div>':`<em>${fm(t.duration||t.d||0)}</em>`}</div>`;

const a=searchResults.filter(t=>liked.some(x=>x.id==t.id));

$('#list').innerHTML=a.length+b.length?(a.length?'<div class="lab">FAVOURITE</div>'+a.map(t=>row(t,1)).join(''):'')+(b.length?'<div class="lab">搜索结果 · 点爱心加入</div>'+b.map(t=>row(t,1)).join(''):''):'<div class="none">没有找到「'+esc($('#q').value)+'」<br>换个关键词试试</div>'}

const hb=`<button class="hb ${liked.some(x=>x.id==t.id)?'l':''}" id="hb" data-a="like">${ic('heart',23,liked.some(x=>x.id==t.id))}</button>`,
bar='<div class="bar" id="bar"><i id="fill"></i></div><div class="tm"><span id="t0"></span><span id="t1"></span></div>',

tt=`<div class="tt"><div><b>${esc(t.name)}</b><span>${esc(t.artist)}</span></div>${hb}</div>`,

else{const c=peerView();const stranger=se.m=='s';const anon=stranger&&se.anonymous;const dmBtn=stranger?`<button data-a="dm" aria-label="私信">${ic('chat',22)}<b class="bd" id="bd"></b></button>`:`<button class="off" type="button" aria-label="熟人一起听请去 LINE 聊" title="熟人一起听请去 LINE 聊" disabled>${ic('chat',22)}</button>`;const cap=anon?'匿名听歌':stranger?('陌生人 · 音乐 ID'+(se.allowRand?' · 可自由切歌':'')):(se.allowRand?'熟人一起听 · 角色可自由切歌':'熟人一起听 · 聊天请去 LINE');const pair=anon
  ?`<div class="pair pair-id"><span class="id-plain">${esc(meMusicId||'我')}</span><div class="wv">${'<i></i>'.repeat(7)}</div><button class="id-plain ta" data-a="dm">${esc(c.n)}</button></div>`

window.addEventListener('message',ev=>{
  const m=ev.data;if(!m||m.source!=='sane333-music-shell')return;
  if(m.type==='music-state'){
    liked=m.liked||[];searchResults=m.searchResults||[];characters=m.characters||[];playlists=m.playlists||[];
    myPlaylists=m.myPlaylists||[];cloudPlaylists=m.cloudPlaylists||[];
    if(typeof m.cloudSyncedAt==='number')cloudSyncedAt=m.cloudSyncedAt;
    if(typeof m.meAvatar==='string')meAvatar=m.meAvatar;
    if(typeof m.meMusicId==='string'&&m.meMusicId)meMusicId=m.meMusicId;
    cur=m.current||null;pos=Number(m.pos)||0;dur=Number(m.dur)|| (cur&&cur.duration)||0;on=!!m.on;
    se=m.session||null;searching=!!m.searching;apiBase=m.apiBase||apiBase;
    if(m.playMode==='shuffle'||m.playMode==='one'||m.playMode==='list')playMode=m.playMode;
    if(m.musicCookie){cook=m.musicCookie}
    if(m.theme){th=m.theme;apply()}
    if(typeof m.charAutoCollect==='boolean')charAutoCollect=m.charAutoCollect;
    if(typeof m.charPlNotify==='boolean')charPlNotify=m.charPlNotify;
    if(m.toast)toast(m.toast);
    if(m.openNowPlaying){$('#np').classList.add('open')}
    if(m.bubble)showPv(m.bubble);
    if(se&&dm)dmR();
    if(plPanel)renderPlaylists();
    sync();
    paintModeBtn();
  }else if(m.type==='music-tick'){
    pos=Number(m.pos)||0;dur=Number(m.dur)||dur;on=!!m.on;ph.classList.toggle('on',on);upd();
    const b=$('#pp');if(b)b.innerHTML=ic(on?'pause':'play',32,1);mini();
  }  else if(m.type==='open-look'){look()}
  else if(m.type==='toast'){toast(m.text||'')}
  else if(m.type==='close-sheets'){const L=$('#layer');if(L)L.innerHTML='';const np=$('#np');if(np)np.classList.remove('open');closeDM();closePlaylistPanel()}
});
let cook=null;
apply();sync();post('music-ready');
