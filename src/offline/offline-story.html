narrative:()=>{const n=S.ui.narrative,opts=(key,items)=>items.map(r=>'<div class="li" style="align-items:flex-start" onclick="S.ui.narrative.'+key+'=\''+r[0]+'\';up()"><div class="rm"><div class="rt">'+r[1]+(n[key]===r[0]?'<span class="bd">使用中</span>':'')+'</div><div class="rs">'+r[2]+'</div></div><span class="ch">'+(n[key]===r[0]?'✓':'')+'</span></div>').join("");return bk("返回")+'<div class="rs" style="margin-bottom:12px;line-height:1.8">三组设置会直接进入线下剧情的 AI 提示词，也适用于邀约后生成的开场白。它们分别控制从谁的角度讲、AI 能不能替你行动、是否重复已发生的内容。</div>'+lab("01 · 叙事视角")+'<div class="box">'+opts("view",[["char1","角色第一人称","角色用「我」叙述自己的经历；主要写角色能感知或合理知道的内容。"],["char3","角色第三人称","用角色姓名或「他／她」叙述，主要跟随角色感知，不自动读取所有人的内心。"],["user1","用户第一人称","以用户为叙述者，用「我」讲述用户经历；不能凭空编造用户未提供的想法和决定。"],["user2","用户第二人称","用「你」描写用户所处场景，适合沉浸式阅读；不能因此替用户决定行动。"],["user3","用户第三人称","用用户姓名或代词叙述用户经历；不能擅自添加用户未表达的台词、意图或内心。"],["omni","上帝视角","可以知道多个角色的内心、不同地点发生的事和彼此不知道的秘密；不代表可以替用户做决定。"],["free","自由视角","根据场景在角色、用户与全局叙述间自然切换；仍受抢话规则限制。"]])+'</div>'+lab("02 · 抢话规则")+'<div class="rs" style="margin:-2px 2px 9px;line-height:1.7">抢话指 AI 是否可以替用户写台词、动作、反应或决定，不是指角色能不能主动说话。</div><div class="box">'+opts("turn",[["no","不抢话 · 推荐","不替用户创作台词、动作、想法、情绪或选择。AI 只写角色、环境和可观察结果。"],["limited","有限抢话","可以衔接用户已经明确做出的动作及其直接结果；不能新增用户主动决定、台词或内心。"],["free","自由抢话","允许 AI 代写用户台词和行动来推进剧情；仍不得覆盖用户明确表达的选择、设定或拒绝。"]])+'</div>'+lab("03 · 复述与转述")+'<div class="rs" style="margin:-2px 2px 9px;line-height:1.7">转述是重新概括或换句话讲已发生的内容；不等于替用户创造新行动。</div><div class="box">'+opts("paraphrase",[["no","不复述","不重复用户刚说的话，也不重讲上一轮已经交代清楚的动作；直接接续情境。"],["light","适度转述 · 推荐","允许必要的简短衔接和回顾，但不逐句复读，不用大段文字重复用户输入。"],["free","自由转述","可以概括或换句话表达已有内容，但不能歪曲原意，也不能把猜测写成事实。"]])+'</div><div class="rs" style="margin-top:12px;line-height:1.8">注意：叙事视角、抢话和转述互不替代。即使选择上帝视角，只要抢话设置为「不抢话」，AI 仍不能擅自编造用户行动或内心。保存后，下一次生成时生效。</div>'},
